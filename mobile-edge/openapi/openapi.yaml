openapi: 3.1.0
info:
  title: SmartResponsor Mobile Edge
  version: v4
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: Health
      responses: { '200': { description: OK } }
  /config:
    get:
      summary: Config flags
      responses:
        '200':
          description: Flags
          headers:
            X-SR-Config-Signature: { description: HMAC hex, schema: { type: string } }
            X-SR-Secret-Version: { description: Secret version, schema: { type: string } }
          content:
            application/json:
              schema: { type: object }
  /entitlement:
    get:
      summary: Entitlement grants
      security: [ { bearerAuth: [] } ]
      responses: { '200': { description: Grants, content: { application/json: { schema: { type: object } } } } }
  /access/signin:
    post:
      summary: Proxy mobile access sign in to Accessing
      description: Accessing owns authentication and session transport; mobile-edge forwards request credentials and passes Accessing response cookies back to the mobile client without minting mobile tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileAccessSignInRequest'
      responses:
        '202':
          description: Accessing accepted the sign in and session transport is pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileAccessSessionPayload'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileAccessErrorPayload'
        '423':
          description: Account locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileAccessErrorPayload'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileAccessErrorPayload'
        '503':
          description: Accessing API unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileAccessErrorPayload'
  /access/register:
    post:
      summary: Proxy mobile access registration to Accessing
      description: Accessing owns registration-side session transport; mobile-edge passes Accessing response cookies back to the mobile client without minting mobile tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileAccessRegisterRequest'
      responses:
        '201':
          description: Accessing accepted the registration request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileAccessSessionPayload'
        '409':
          description: Registration conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileAccessErrorPayload'
        '503':
          description: Accessing API unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileAccessErrorPayload'
  /access/logout:
    post:
      summary: Proxy mobile access logout to Accessing
      description: Accessing owns logout and session clearing; mobile-edge passes Accessing response cookies back to the mobile client.
      responses:
        '200':
          description: Accessing returned the current session state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileAccessSessionPayload'
        '503':
          description: Accessing API unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileAccessErrorPayload'
  /access/session:
    get:
      summary: Proxy mobile access session to Accessing
      description: Accessing owns session lookup and transport; mobile-edge forwards client session credentials and passes Accessing response cookies back to the mobile client.
      responses:
        '200':
          description: Accessing returned the current mobile access session state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileAccessSessionPayload'
        '503':
          description: Accessing API unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileAccessErrorPayload'
  /access/recovery/request:
    post:
      summary: Proxy mobile access recovery request to Accessing
      description: Accessing owns recovery challenge issuing; mobile-edge forwards the email request and passes the normalized session response back to the mobile client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileAccessRecoveryRequest'
      responses:
        '202':
          description: Accessing accepted the recovery request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileAccessSessionPayload'
        '422':
          description: Invalid recovery request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileAccessErrorPayload'
        '503':
          description: Accessing API unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileAccessErrorPayload'
  /access/recovery/reset:
    post:
      summary: Proxy mobile access recovery reset to Accessing
      description: Accessing owns recovery completion; mobile-edge forwards the request and returns the normalized session response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileAccessRecoveryResetRequest'
      responses:
        '202':
          description: Accessing accepted the recovery reset request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileAccessSessionPayload'
        '422':
          description: Invalid recovery reset payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileAccessErrorPayload'
        '503':
          description: Accessing API unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileAccessErrorPayload'
  /access/verification/resend:
    post:
      summary: Mobile access verification resend
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/MobileAccessSessionPayload' } } } }
        '503': { description: Accessing API unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/MobileAccessErrorPayload' } } } }
  /access/verification/confirm:
    post:
      summary: Mobile access verification confirm
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/MobileAccessSessionPayload' } } } }
        '422': { description: Invalid verification payload, content: { application/json: { schema: { $ref: '#/components/schemas/MobileAccessErrorPayload' } } } }
        '503': { description: Accessing API unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/MobileAccessErrorPayload' } } } }
  /access/second-factor/challenge:
    post:
      summary: Mobile access second factor challenge
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/MobileAccessSessionPayload' } } } }
        '503': { description: Accessing API unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/MobileAccessErrorPayload' } } } }
  /access/second-factor/verify:
    post:
      summary: Mobile access second factor verify
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/MobileAccessSessionPayload' } } } }
        '422': { description: Invalid second factor payload, content: { application/json: { schema: { $ref: '#/components/schemas/MobileAccessErrorPayload' } } } }
        '503': { description: Accessing API unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/MobileAccessErrorPayload' } } } }
  /cart/current:
    get:
      summary: Mobile current cart
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MobileCartPayload' } } } }
        '503': { description: Carting API unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/MobileAccessErrorPayload' } } } }
  /cart/item:
    post:
      summary: Mobile add cart item
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MobileCartItemMutationRequest' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MobileCartPayload' } } } }
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/MobileCartPayload' } } } }
        '422': { description: Invalid cart item payload, content: { application/json: { schema: { $ref: '#/components/schemas/MobileAccessErrorPayload' } } } }
        '503': { description: Carting API unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/MobileAccessErrorPayload' } } } }
  /cart/checkout-handoff:
    post:
      summary: Mobile cart checkout handoff
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MobileCartCheckoutHandoffPayload' } } } }
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/MobileCartCheckoutHandoffPayload' } } } }
        '409': { description: Cart not ready, content: { application/json: { schema: { $ref: '#/components/schemas/MobileAccessErrorPayload' } } } }
        '503': { description: Carting API unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/MobileAccessErrorPayload' } } } }
  /attachment:
    get:
      summary: Mobile attachment list
      parameters:
        - in: query
          name: ownerType
          required: false
          schema: { type: string, minLength: 1 }
        - in: query
          name: ownerId
          required: false
          schema: { type: string, minLength: 1 }
        - in: query
          name: context
          required: false
          schema: { type: string, minLength: 1 }
        - in: query
          name: slot
          required: false
          schema: { type: string, minLength: 1 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MobileAttachmentListPayload' } } } }
        '503': { description: Attaching API unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/MobileAccessErrorPayload' } } } }
  /attachment/link:
    post:
      summary: Mobile attachment link
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MobileAttachmentLinkRequest' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MobileAttachmentLinkPayload' } } } }
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/MobileAttachmentLinkPayload' } } } }
        '422': { description: Invalid attachment link payload, content: { application/json: { schema: { $ref: '#/components/schemas/MobileAccessErrorPayload' } } } }
        '503': { description: Attaching API unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/MobileAccessErrorPayload' } } } }
  /navigation/mobile/shell:
    get:
      summary: Mobile navigation shell
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MobileNavigationShellPayload' } } } }
        '503': { description: Navigating API unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/MobileAccessErrorPayload' } } } }
  /vendor/profile/{vendorId}:
    get:
      summary: Mobile vendor profile
      parameters:
        - in: path
          name: vendorId
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MobileVendorProfilePayload' } } } }
        '503': { description: Vendoring API unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/MobileAccessErrorPayload' } } } }
  /vendor/summary/{vendorId}:
    get:
      summary: Mobile vendor summary
      parameters:
        - in: path
          name: vendorId
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MobileVendorSummaryPayload' } } } }
        '503': { description: Vendoring API unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/MobileAccessErrorPayload' } } } }
  /vendor/statement/{vendorId}:
    get:
      summary: Mobile vendor statement
      parameters:
        - in: path
          name: vendorId
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MobileVendorStatementPayload' } } } }
        '503': { description: Vendoring API unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/MobileAccessErrorPayload' } } } }
  /vendor/payout/{vendorId}:
    get:
      summary: Mobile vendor payout
      parameters:
        - in: path
          name: vendorId
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MobileVendorPayoutPayload' } } } }
        '503': { description: Vendoring API unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/MobileAccessErrorPayload' } } } }
  /vendor/transaction/{vendorId}:
    get:
      summary: Mobile vendor transaction list
      parameters:
        - in: path
          name: vendorId
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MobileVendorTransactionListPayload' } } } }
        '503': { description: Vendoring API unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/MobileAccessErrorPayload' } } } }
  /push/register:
    post:
      summary: Register push token
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushRegisterV1'
      responses: { '204': { description: No Content } }
  /receipt/verify:
    post:
      summary: Verify purchase receipt
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptVerifyV1'
      responses: { '200': { description: OK } }
  /analytic/batch:
    post:
      summary: Analytics JSON batch
      parameters:
        - in: header
          name: X-SR-Analytic-Signature
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnalyticBatchJsonV1' }
      responses: { '202': { description: Accepted } }
  /analytic/batch-ndjson:
    post:
      summary: Analytics NDJSON
      parameters:
        - in: header
          name: X-SR-Analytic-Signature
          required: true
          schema: { type: string }
      responses: { '202': { description: Accepted } }
  /sync/event:
    post:
      summary: Client sync event
      responses: { '204': { description: No Content } }
  /admin/stats:
    get:
      summary: Admin stats
      parameters:
        - in: header
          name: X-Admin-Token
          required: true
          schema: { type: string }
      responses: { '200': { description: OK } }
  /admin/schema/{name}/{ver}:
    get:
      summary: Schema fetch
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
        - in: path
          name: ver
          required: true
          schema: { type: string }
        - in: header
          name: X-Admin-Token
          required: true
          schema: { type: string }
      responses: { '200': { description: OK } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    PushRegisterV1:
      type: object
      required: [deviceId, token]
      properties:
        deviceId: { type: string }
        token: { type: string }
        platform: { type: string, enum: [android, ios, web] }
    MobileAccessSignInRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, minLength: 3 }
        password: { type: string, minLength: 8 }
    MobileAccessRegisterRequest:
      type: object
      required: [displayName, email, password]
      properties:
        displayName: { type: string, minLength: 1 }
        email: { type: string, minLength: 3 }
        password: { type: string, minLength: 8 }
    MobileAccessRecoveryRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, minLength: 3 }
    MobileAccessRecoveryResetRequest:
      type: object
      additionalProperties: false
      required: [email, code, password]
      properties:
        email: { type: string, minLength: 3 }
        code: { type: string, minLength: 1 }
        password: { type: string, minLength: 8 }
    MobileAccessIdentityPayload:
      type: object
      additionalProperties: false
      description: accountId is a nullable compatibility field and is not sourced from Accessing in this milestone.
      required: [vendorId, accountId, displayName, email, emailVerified, secondFactorEnabled]
      properties:
        vendorId: { type: string }
        accountId:
          anyOf:
            - { type: string }
            - { type: 'null' }
        displayName: { type: string }
        email: { type: string }
        emailVerified: { type: boolean }
        secondFactorEnabled: { type: boolean }
    MobileAccessSessionPayload:
      type: object
      additionalProperties: false
      required: [status, identity, requiresVerification, requiresSecondFactor]
      properties:
        status: { type: string }
        identity:
          anyOf:
            - { $ref: '#/components/schemas/MobileAccessIdentityPayload' }
            - { type: 'null' }
        requiresVerification: { type: boolean }
        requiresSecondFactor: { type: boolean }
    MobileAccessErrorPayload:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        fieldErrors:
          anyOf:
            - type: object
              additionalProperties:
                type: array
                items: { type: string }
            - { type: 'null' }
    MobileNavigationShellPayload:
      type: object
      additionalProperties: true
      required: [schema, channel, platforms, locations]
      properties:
        schema: { type: string }
        channel: { type: string, enum: [mobile] }
        platforms:
          type: array
          items: { type: string }
        locations: { type: object, additionalProperties: true }
    MobileAttachmentItemPayload:
      type: object
      additionalProperties: false
      required: [attachmentId, type, mimeType, downloadUrl, payload]
      properties:
        attachmentId: { type: string, minLength: 1 }
        type: { type: string, minLength: 1 }
        mimeType: { anyOf: [{ type: string, minLength: 1 }, { type: 'null' }] }
        downloadUrl: { anyOf: [{ type: string, minLength: 1 }, { type: 'null' }] }
        payload: { type: object, additionalProperties: true }
    MobileAttachmentListPayload:
      type: object
      additionalProperties: false
      required: [ownerType, ownerId, count, items, payload]
      properties:
        ownerType: { type: string, minLength: 1 }
        ownerId: { type: string, minLength: 1 }
        count: { type: integer, minimum: 0 }
        items:
          type: array
          items: { $ref: '#/components/schemas/MobileAttachmentItemPayload' }
        payload: { type: object, additionalProperties: true }
    MobileAttachmentLinkRequest:
      type: object
      additionalProperties: false
      required: [attachmentId, ownerType, ownerId]
      properties:
        attachmentId: { type: integer, minimum: 1 }
        ownerType: { type: string, minLength: 1 }
        ownerId: { type: string, minLength: 1 }
        context: { anyOf: [{ type: string, minLength: 1 }, { type: 'null' }] }
        slot: { anyOf: [{ type: string, minLength: 1 }, { type: 'null' }] }
        position: { type: integer, minimum: 0 }
        isPrimary: { type: boolean }
    MobileAttachmentLinkPayload:
      type: object
      additionalProperties: false
      required: [linkId, attachmentId, ownerType, ownerId, payload]
      properties:
        linkId: { type: string, minLength: 1 }
        attachmentId: { type: string, minLength: 1 }
        ownerType: { type: string, minLength: 1 }
        ownerId: { type: string, minLength: 1 }
        context: { anyOf: [{ type: string, minLength: 1 }, { type: 'null' }] }
        slot: { anyOf: [{ type: string, minLength: 1 }, { type: 'null' }] }
        position: { type: integer, minimum: 0 }
        isPrimary: { type: boolean }
        payload: { type: object, additionalProperties: true }
    MobileCartItemPayload:
      type: object
      additionalProperties: false
      required: [itemId, offerReference, title, unitPriceMinor, currencyCode, quantity, lineTotalMinor, metadata]
      properties:
        itemId: { type: string, minLength: 1 }
        offerReference: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        unitPriceMinor: { type: integer, minimum: 0 }
        currencyCode: { type: string, minLength: 3 }
        quantity: { type: integer, minimum: 1 }
        lineTotalMinor: { type: integer, minimum: 0 }
        metadata: { type: object, additionalProperties: true }
    MobileCartPayload:
      type: object
      additionalProperties: false
      required: [cartId, cartToken, ownerReference, status, currencyCode, itemCount, subtotalMinor, totalMinor, items, expiresAt, updatedAt, payload]
      properties:
        cartId: { anyOf: [{ type: string, minLength: 1 }, { type: 'null' }] }
        cartToken: { type: string, minLength: 1 }
        ownerReference: { anyOf: [{ type: string, minLength: 1 }, { type: 'null' }] }
        status: { type: string, minLength: 1 }
        currencyCode: { type: string, minLength: 3 }
        itemCount: { type: integer, minimum: 0 }
        subtotalMinor: { type: integer, minimum: 0 }
        totalMinor: { type: integer, minimum: 0 }
        items:
          type: array
          items: { $ref: '#/components/schemas/MobileCartItemPayload' }
        expiresAt: { anyOf: [{ type: string, minLength: 1 }, { type: 'null' }] }
        updatedAt: { anyOf: [{ type: string, minLength: 1 }, { type: 'null' }] }
        payload: { type: object, additionalProperties: true }
    MobileCartItemMutationRequest:
      type: object
      additionalProperties: false
      required: [offerReference, quantity]
      properties:
        offerReference: { type: string, minLength: 1 }
        quantity: { type: integer, minimum: 1 }
        title: { anyOf: [{ type: string, minLength: 1 }, { type: 'null' }] }
        unitPriceMinor: { anyOf: [{ type: integer, minimum: 0 }, { type: 'null' }] }
        currencyCode: { anyOf: [{ type: string, minLength: 3 }, { type: 'null' }] }
        metadata: { type: object, additionalProperties: true }
    MobileCartCheckoutHandoffPayload:
      type: object
      additionalProperties: false
      required: [cartId, cartToken, handoffId, checkoutUrl, status, expiresAt, payload]
      properties:
        cartId: { anyOf: [{ type: string, minLength: 1 }, { type: 'null' }] }
        cartToken: { type: string, minLength: 1 }
        handoffId: { type: string, minLength: 1 }
        checkoutUrl: { anyOf: [{ type: string, minLength: 1 }, { type: 'null' }] }
        status: { type: string, minLength: 1 }
        expiresAt: { anyOf: [{ type: string, minLength: 1 }, { type: 'null' }] }
        payload: { type: object, additionalProperties: true }
    MobileVendorProfilePayload:
      type: object
      additionalProperties: false
      required: [vendorId, displayName, brandName, status, completionPercent, readyForPublishing, nextAction, avatarUrl, coverUrl, about, website, publicationStatus]
      properties:
        vendorId: { type: string, minLength: 1 }
        displayName: { anyOf: [{ type: string, minLength: 1 }, { type: 'null' }] }
        brandName: { anyOf: [{ type: string, minLength: 1 }, { type: 'null' }] }
        status: { anyOf: [{ type: string, minLength: 1 }, { type: 'null' }] }
        completionPercent: { type: integer, minimum: 0, maximum: 100 }
        readyForPublishing: { type: boolean }
        nextAction: { anyOf: [{ type: string, minLength: 1 }, { type: 'null' }] }
        avatarUrl: { anyOf: [{ type: string, minLength: 1 }, { type: 'null' }] }
        coverUrl: { anyOf: [{ type: string, minLength: 1 }, { type: 'null' }] }
        about: { anyOf: [{ type: string, minLength: 1 }, { type: 'null' }] }
        website: { anyOf: [{ type: string, minLength: 1 }, { type: 'null' }] }
        publicationStatus: { anyOf: [{ type: string, minLength: 1 }, { type: 'null' }] }
    MobileVendorSummaryPayload:
      type: object
      additionalProperties: false
      required: [vendorId, brandName, status, profileCompletionPercent, nextAction, payload]
      properties:
        vendorId: { type: string, minLength: 1 }
        brandName: { anyOf: [{ type: string, minLength: 1 }, { type: 'null' }] }
        status: { anyOf: [{ type: string, minLength: 1 }, { type: 'null' }] }
        profileCompletionPercent: { type: integer, minimum: 0, maximum: 100 }
        nextAction: { anyOf: [{ type: string, minLength: 1 }, { type: 'null' }] }
        payload: { type: object, additionalProperties: true }
    MobileVendorStatementPayload:
      type: object
      additionalProperties: false
      required: [vendorId, statementStatus, currency, grossAmount, netAmount, payload]
      properties:
        vendorId: { type: string, minLength: 1 }
        statementStatus: { anyOf: [{ type: string, minLength: 1 }, { type: 'null' }] }
        currency: { anyOf: [{ type: string, minLength: 1 }, { type: 'null' }] }
        grossAmount: { type: number }
        netAmount: { type: number }
        payload: { type: object, additionalProperties: true }
    MobileVendorPayoutPayload:
      type: object
      additionalProperties: false
      required: [vendorId, payoutStatus, currency, availableAmount, pendingAmount, payoutAccountLabel, payload]
      properties:
        vendorId: { type: string, minLength: 1 }
        payoutStatus: { anyOf: [{ type: string, minLength: 1 }, { type: 'null' }] }
